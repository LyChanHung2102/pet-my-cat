<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pet Your Cat 🐾</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <canvas id="game-canvas" aria-label="Pet Your Cat 3D world"></canvas>

    <!-- HUD -->
    <div id="hud" aria-live="polite">

        <!-- Top-left: cat info -->
        <div id="hud-top">
            <div id="cat-info">
                <span id="cat-name-display">Milo</span>
                <span id="cat-state">Relaxing</span>
                <span id="time-of-day" aria-label="Time of day">☀️</span>
            </div>

            <div class="stat-row">
                <span class="stat-icon" aria-label="Affection">❤️</span>
                <div class="stat-bar" role="progressbar" aria-label="Affection" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                    <div id="affection-fill" class="stat-fill fill-pink"></div>
                </div>
            </div>

            <div class="stat-row">
                <span class="stat-icon" aria-label="Hunger">🐟</span>
                <div class="stat-bar" role="progressbar" aria-label="Hunger" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
                    <div id="hunger-fill" class="stat-fill fill-orange"></div>
                </div>
            </div>

            <div id="mood-text">Happy 😸</div>
        </div>

        <!-- Bottom: action buttons -->
        <div id="hud-bottom">
            <button id="btn-pet"       class="action-btn" aria-label="Pet the cat">🤚 Pet</button>
            <button id="btn-play"      class="action-btn" aria-label="Play with the cat">🎾 Play</button>
            <button id="btn-call"      class="action-btn" aria-label="Call the cat">📣 Call</button>
            <button id="btn-feed"      class="action-btn" aria-label="Feed the cat">🐟 Feed</button>
            <button id="btn-customize" class="icon-btn"   aria-label="Customize cat">🎨</button>
            <button id="btn-mute"      class="icon-btn"   aria-label="Mute">🔊</button>
        </div>

    </div>

    <!-- Customize panel -->
    <div id="customize-panel" class="panel hidden" role="dialog" aria-label="Customize your cat" aria-modal="false">
        <div class="panel-header">
            <span>Customize</span>
            <button id="customize-close" class="close-btn" aria-label="Close">✕</button>
        </div>
        <div class="customize-body"></div>
    </div>

    <!-- Contextual hint -->
    <div id="hint" class="hint hidden" aria-hidden="true">
        Touch the cat to say hello 🐾
    </div>

    <!-- Start overlay -->
    <div id="start-overlay" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <div class="overlay-card">
            <div class="paw-icon" aria-hidden="true">🐾</div>
            <h1 id="welcome-title">Pet Your Cat</h1>
            <p>Meet your new friend.<br>What should we call them?</p>
            <input
                id="cat-name-input"
                type="text"
                maxlength="20"
                placeholder="Milo"
                aria-label="Cat name"
                autocomplete="off"
            >
            <button id="start-btn" class="start-btn">Say Hello 🐱</button>
        </div>
    </div>

    <!-- No WebGL fallback -->
    <div id="no-webgl" class="hidden" role="alert">
        <div class="overlay-card">
            <div class="paw-icon" aria-hidden="true">🐾</div>
            <h2>3D not available</h2>
            <p>Your browser doesn't support WebGL.<br>Please try a modern browser like Chrome or Firefox.</p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
